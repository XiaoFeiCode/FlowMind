# -*- coding: utf-8 -*-
# 售后模块Domain定义
# 适配flowmind框架

version: "3.1"

# 售后相关槽位
slots:
  postsale_order_id:
    type: text
    description: 售后订单ID
  
  postsale_type:
    type: text
    description: 售后类型（退货/换货）
  
  postsale_reason:
    type: text
    description: 售后原因

# 售后相关响应
# 注意：售后类型和原因已由 action 按钮接管，不再使用下方模板
responses:
  utter_default:
    - text: "请问还有什么我可以帮您的吗？"

# 售后相关Action声明
actions:
  - action_ask_order_id_after_delivered
  - action_check_postsale_eligible
  - action_ask_postsale_reason
  - action_apply_postsale
