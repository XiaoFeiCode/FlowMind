# -*- coding: utf-8 -*-
# 售后Flow定义
# 适配flowmind框架语法

version: "3.1"

flows:
  apply_postsale:
    name: 申请售后
    description: 当用户想要申请退货或换货时使用
    steps:
      - id: ask_order
        action: action_ask_order_id_after_delivered
      - id: collect_order
        collect: order_id
        next:
          - if: slots.order_id == "false"
            then: END
          - if: slots.order_id == "NO_ORDER"
            then: END
          - else: check_eligible
      - id: check_eligible
        action: action_check_postsale_eligible
      - id: collect_type
        collect: postsale_type
      - id: ask_reason
        action: action_ask_postsale_reason
      - id: collect_reason
        collect: postsale_reason
      - id: apply
        action: action_apply_postsale
